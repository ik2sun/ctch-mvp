# 경쟁사 모니터링 자동 체크를 1시간마다 부른다.
# Vercel Hobby 크론은 하루 1회까지라(vercel.json) 1·3·6·12시간 주기는 여기서 돌린다.
# 실제로 확인할 키워드(주기가 된 것만)는 /api/cron/competitor-rank-check 가 고른다.
# 필요: 저장소 Settings → Secrets and variables → Actions 에 CRON_SECRET(Vercel 값과 동일)
name: competitor-hourly

on:
  schedule:
    - cron: "5 * * * *" # 매시 5분(UTC 기준이지만 매시라 무관). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call competitor rank check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret이 없습니다"; exit 1; fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ctch-mvp.vercel.app/api/cron/competitor-rank-check)
          cat out.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
